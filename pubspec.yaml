name: psito_notes
description: "Sticky notes for the desktop, with cockatiels. No ads, no telemetry, no account."
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  path_provider: ^2.1.5
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: NoteHand
      fonts:
        - asset: assets/fonts/Caveat.ttf
    - family: NoteSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
